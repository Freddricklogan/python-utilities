# Job order is lint -> test -> security-scan. There is no build or deploy: the artefact is a CLI package.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  attribution:
    name: Attribution check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No tool attribution in the tree or the history
        run: |
          set -e
          if git grep -iIE 'claude|\banthropic|co-authored-by|generated with|noreply@anthropic' -- . ':!*.lock' ':!**/vendor/**' ':!**/node_modules/**' ':!.github/workflows/*'; then
            echo "::error::tool attribution found in tracked files"; exit 1; fi
          if git log --all --format='%an <%ae>%n%cn <%ce>%n%B' | grep -iE 'claude|\banthropic|co-authored-by|generated with|noreply@anthropic'; then
            echo "::error::tool attribution found in commit history"; exit 1; fi
          for f in CLAUDE.md AGENTS.md .cursorrules .claude .cursor .github/copilot-instructions.md; do
            [ -e "$f" ] && { echo "::error::$f must not be committed"; exit 1; }; done
          echo "attribution check: clean"

  lint:
    name: Lint (ruff + mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv venv --clear && uv pip install -e ".[dev]"
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy

  link-check:
    name: Link check (advisory)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 4 --accept 200,206,429,999
            --exclude 'github.com/${{ github.repository }}/actions'
            README.md docs/CASE_STUDY.md
          fail: true

  test:
    name: Test (pytest + coverage) and pipx install
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv venv --clear && uv pip install -e ".[dev]"
      - run: uv run pytest --cov --cov-report=term
      - name: Install with pipx from the checkout and run the CLI
        run: |
          uv tool install --from . pyutils-fl
          uv tool run --from . pyutils --help
          PYUTILS_HOME=/tmp/pyu uv tool run --from . pyutils todo add "ci smoke" && PYUTILS_HOME=/tmp/pyu uv tool run --from . pyutils todo list

  security-scan:
    name: Security scan (bandit + pip-audit + Trivy)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv venv --clear && uv pip install -e ".[dev]"
      - run: uv run bandit -q -r src
      - run: uv run pip-audit --skip-editable
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
