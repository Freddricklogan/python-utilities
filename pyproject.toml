[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pyutils-fl"
version = "1.0.0"
description = "Three small command-line utilities in one typed package: a task list, a blog-post manager, and a weather lookup backed by the Open-Meteo API (no key)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Freddrick Logan" }]
dependencies = ["typer>=0.12", "pydantic>=2.8", "requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "types-requests>=2.32", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
pyutils = "pyutils.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pyutils"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "DTZ", "S", "SIM", "RUF", "T20", "PTH", "RET", "ARG"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001"]
"src/pyutils/cli.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pyutils"]
omit = ["src/pyutils/cli.py"]

[tool.coverage.report]
show_missing = true
